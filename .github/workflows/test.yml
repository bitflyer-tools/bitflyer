name: test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Run lint
        run: bundle exec rubocop lib
  typecheck:
    runs-on: ubuntu-24.04
    env:
      BUNDLE_WITH: typecheck
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Check generated realtime signatures
        run: ruby script/generate_realtime_signatures.rb --check
      - name: Run type check
        run: bundle exec rake steep
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        ruby: ['.ruby-version', '3.3']
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          rubygems: latest
          bundler-cache: true
      - name: Run test
        env:
          RAILS_ENV: test
          COVERAGE: true
        run: bundle exec rspec
