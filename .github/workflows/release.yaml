name: release

"on":
  push:
    tags: ["v*"]

jobs:
  push:
    name: Push gem to RubyGems.org
    if: github.event.deleted == false
    runs-on: ubuntu-24.04
    environment:
      name: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          bundler-cache: true
          ruby-version: .ruby-version
      - name: Check release tag
        shell: ruby {0}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          require File.join(Dir.pwd, 'lib/bitflyer/version')
          version = Bitflyer::VERSION
          tag = ENV.fetch('RELEASE_TAG')
          unless version.match?(/\A(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\z/) && tag == "v#{version}"
            abort "Release tag #{tag.inspect} must match the gem's stable version (v#{version})"
          end
      - uses: rubygems/release-gem@5c53f5308233b7c0f47411f0471b3faae6fa57b2 # v1.4.2
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes
