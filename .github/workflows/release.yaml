name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
jobs:
  push:
    name: Push gem to RubyGems.org
    runs-on: ubuntu-24.04
    environment:
      name: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          bundler-cache: true
          ruby-version: .ruby-version
      - name: Setup Git
        run: |
          git config --global user.email "unhappychoice@gmail.com"
          git config --global user.name "Yuji Ueki"
      - name: Bump version
        env:
          BUNDLE_GEMFILE: .github/release.gemfile
          BUNDLE_FROZEN: "true"
          BUNDLE_PATH: ${{ github.workspace }}/.bundle/release
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          bundle install
          # Bundler installs gem-release outside the RubyGems plugin search path.
          bundle exec ruby -rrubygems_plugin -e 'Gem::Commands::BumpCommand.new.invoke(*ARGV)' -- \
            --version "$RELEASE_VERSION" --message ':tada: Bump %{name} to %{version}'
      - name: Refresh project lockfile
        env:
          BUNDLE_FROZEN: "false"
        run: |
          bundle lock --local
          git add Gemfile.lock
          git commit --amend --no-edit
      - uses: rubygems/release-gem@5c53f5308233b7c0f47411f0471b3faae6fa57b2 # v1.4.2
